name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Build the Explorer menu (PR7ZShell.dll)
        run: |
          cmake -S shellext -B shellext/build -A x64
          cmake --build shellext/build --config Release
      - name: Tests (against the bundled 7z.exe and the built PR7ZShell.dll)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build PR7-Z.exe
        run: pyinstaller --noconfirm pr7z.spec
      - name: Check the build
        shell: pwsh
        run: |
          foreach ($f in "dist/PR7-Z/PR7-Z.exe", "dist/PR7-Z/_internal/engine/7z.exe", "dist/PR7-Z/_internal/engine/7z.dll",
                         "dist/PR7-Z/_internal/engine/7z.sfx", "dist/PR7-Z/_internal/pr7z/fonts/Inter-Regular.ttf",
                         "dist/PR7-Z/_internal/shellext/PR7ZShell.dll") {
            if (-not (Test-Path $f)) { throw "missing $f" }
          }
          Copy-Item README.md, NOTICE.md dist/PR7-Z/
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/PR7-Z -DestinationPath "PR7-Z-${{ github.ref_name }}-windows-x64.zip".Replace('/', '-')
      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $v = (Select-String -Path pr7z/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /DAppVersion=$v installer/pr7z.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          "PR7Z_VERSION=$v" >> $env:GITHUB_ENV
      - name: Test the installer (silent install, check, uninstall, check)
        shell: pwsh
        run: |
          $p = Start-Process "dist/PR7-Z-Setup-$env:PR7Z_VERSION.exe" -Wait -PassThru `
               -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=install.log"
          if ($p.ExitCode -ne 0) { Get-Content install.log; throw "install failed: $($p.ExitCode)" }
          python tools/verify_install.py installed
          if ($LASTEXITCODE -ne 0) { Get-Content install.log; throw "install check failed" }
          $p = Start-Process "$env:LOCALAPPDATA\Programs\PR7-Z\unins000.exe" -Wait -PassThru `
               -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          if ($p.ExitCode -ne 0) { throw "uninstall failed: $($p.ExitCode)" }
          python tools/verify_install.py uninstalled
          if ($LASTEXITCODE -ne 0) { throw "uninstall check failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: PR7-Z-Setup
          path: dist/PR7-Z-Setup-*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: PR7-Z-windows-x64
          path: PR7-Z-*.zip
      - name: Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PR7-Z-Setup-*.exe
            PR7-Z-*.zip
          name: Paragon PR7-Z ${{ github.ref_name }}
