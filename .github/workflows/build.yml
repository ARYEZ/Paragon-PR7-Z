name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Build the Explorer menu (PR7ZShell.dll)
        run: |
          cmake -S shellext -B shellext/build -A x64
          cmake --build shellext/build --config Release
      - name: Tests (against the bundled 7z.exe and the built PR7ZShell.dll)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build PR7-Z.exe
        run: pyinstaller --noconfirm pr7z.spec
      - name: Check the build
        shell: pwsh
        run: |
          foreach ($f in "dist/PR7-Z/PR7-Z.exe", "dist/PR7-Z/_internal/engine/7z.exe", "dist/PR7-Z/_internal/engine/7z.dll",
                         "dist/PR7-Z/_internal/engine/7z.sfx", "dist/PR7-Z/_internal/pr7z/fonts/Inter-Regular.ttf",
                         "dist/PR7-Z/_internal/shellext/PR7ZShell.dll") {
            if (-not (Test-Path $f)) { throw "missing $f" }
          }
          Copy-Item README.md, NOTICE.md dist/PR7-Z/
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/PR7-Z -DestinationPath "PR7-Z-${{ github.ref_name }}-windows-x64.zip".Replace('/', '-')
      - uses: actions/upload-artifact@v4
        with:
          name: PR7-Z-windows-x64
          path: PR7-Z-*.zip
      - name: Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PR7-Z-*.zip
          name: Paragon PR7-Z ${{ github.ref_name }}
